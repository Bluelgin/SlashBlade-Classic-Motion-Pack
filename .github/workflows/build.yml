name: Validate and build resource pack
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_old_dream_oracle.py
      - run: python scripts/audit_phase_one.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_pack.py
      - run: python scripts/validate_pack.py dist/SlashBlade-Classic-Motion-Pack-1.20.1-v0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SlashBlade-Classic-Motion-Pack-1.20.1-v0.1.0
          path: dist/*